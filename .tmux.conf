# Look: status bar on top, quiet colours
set -g status-position top
set -g status-left "#S "
set -g status-right "%H:%M"
set -g status-style "bg=#222222,fg=white"
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#00afff"

set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g set-titles on
set -sg escape-time 10
set -g set-clipboard on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"

# Vi keys in copy mode and the command prompt
setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# True colour, and clickable OSC 8 links for cmux/Ghostty, including over ssh
# where TERM is xterm-256color. Needed on every hop: laptop tmux and Mac mini tmux.
set -as terminal-overrides ',xterm-ghostty*:RGB,ghostty*:RGB,xterm-256color*:RGB'
set -as terminal-features ',xterm-ghostty*:hyperlinks,ghostty*:hyperlinks,xterm-256color:hyperlinks'

# Reload with prefix+r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
